name: Verify .NET migration
on:
  push:
    branches: [main, migration/dotnet-react]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm run test:installer
      - run: npm run setup:web -- --registry npmjs
      - run: npm run build:web
      - run: git diff --exit-code -- web/package-lock.json
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AgentDashboard.slnx --configfile NuGet.Config
      - run: dotnet test AgentDashboard.slnx --no-restore --configuration Release --logger trx
      - run: dotnet publish src/Dashboard.Collector --no-restore --configuration Release --no-self-contained -o artifacts/collector
      - name: Exercise packaged collector with isolated app paths
        shell: pwsh
        run: |
          $env:CODEX_STATE_DB = Join-Path $env:RUNNER_TEMP 'missing-codex.sqlite'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'missing-claude'
          $env:COPILOT_STORAGE = Join-Path $env:RUNNER_TEMP 'missing-copilot'
          dotnet artifacts/collector/Dashboard.Collector.dll inspect --state artifacts/collector-smoke.sqlite
          if ($LASTEXITCODE -ne 0) { throw 'Packaged collector failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: collector-${{ matrix.os }}
          path: artifacts/collector/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
